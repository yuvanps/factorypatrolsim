# =============================================================================
# APF CROSSING TEST task set (2 drones) — drone-drone repulsion check
# =============================================================================
# Factory frame: x = Gazebo X (east), y = Gazebo Y (north), z = -height.
#
# Built so the two drones' patrol loops CROSS at the same altitude:
#   Allocation (existing auction, spawns drone0 (-8,7), drone1 (-4,7), cap 2 each):
#     201 -> drone 0 (nearest), 202 -> drone 1 (workload penalty),
#     203 -> drone 1 (nearer), 204 -> drone 0 (drone 1 is at its cap).
#   drone 0 loops 201 (-10,5.5) <-> 204 (-1.5,2.5)
#   drone 1 loops 202 (-2,5.5)  <-> 203 (-5,2.5)
#   The two legs intersect near (-4.1, 3.4), north of the rack rows (which end at y=2).
#
#   ./scripts/start_experiment.sh --algorithm apf --drones 2 --tasks config/tasks/apf_crossing_test.yaml

tasks:
  - {id: 201, position: [-10.0, 5.5, -3.5], priority: 1, inspection_type: 0, hover_duration: 4.0, label: "Crossing W"}
  - {id: 202, position: [-2.0, 5.5, -3.5], priority: 1, inspection_type: 0, hover_duration: 4.0, label: "Crossing NE"}
  - {id: 203, position: [-5.0, 2.5, -3.5], priority: 1, inspection_type: 0, hover_duration: 4.0, label: "Crossing SW"}
  - {id: 204, position: [-1.5, 2.5, -3.5], priority: 1, inspection_type: 0, hover_duration: 4.0, label: "Crossing E"}
